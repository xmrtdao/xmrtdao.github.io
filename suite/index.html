<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suite AI — Redirecting</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://relay.mobilemonero.com/suite/" />
  <!-- Soft redirect: preserve SEO via canonical + meta refresh -->
  <meta http-equiv="refresh" content="0; url=https://relay.mobilemonero.com/suite/" />
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;text-align:center}
    a{color:#38bdf8}
    .loader{width:32px;height:32px;border:3px solid rgba(56,189,248,.2);border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Suite AI</h2>
  <p>Redirecting to the live relay…</p>
  <p><a href="https://relay.mobilemonero.com/suite/">Click here if not redirected automatically</a></p>

  <!-- Fallback JS redirect for browsers that ignore meta refresh -->
  <script>window.location.replace("https://relay.mobilemonero.com/suite/");</script>

  <!-- Preserve SEO structured data pointing at canonical -->
  <script type="application/ld+json">{
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Suite by XMRT-DAO",
    "url": "https://relay.mobilemonero.com/suite/",
    "description": "Suite combines persistent memory, AI executives, and deep Google, GitHub, and Supabase integrations."
  }</script>
</body>
</html>
